# Windows build and test pipeline for cloudflared
# Handles building, signing, and packaging the Windows MSI installer

.windows_build_base:
  tags:
    - windows
  before_script:
    - $env:PATH = "C:\Go\bin;$env:PATH"
    - go version
    - go env

build-windows-amd64:
  extends: .windows_build_base
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    GOOS: windows
    GOARCH: amd64
    TARGET: cloudflared-windows-amd64.exe
  script:
    - go build -v -ldflags "-X main.Version=$VERSION -X main.BuildTime=$CI_COMMIT_TIMESTAMP" -o $TARGET ./cmd/cloudflared
  artifacts:
    paths:
      - cloudflared-windows-amd64.exe
    expire_in: 1 week

build-windows-386:
  extends: .windows_build_base
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    GOOS: windows
    GOARCH: "386"
    TARGET: cloudflared-windows-386.exe
  script:
    - go build -v -ldflags "-X main.Version=$VERSION -X main.BuildTime=$CI_COMMIT_TIMESTAMP" -o $TARGET ./cmd/cloudflared
  artifacts:
    paths:
      - cloudflared-windows-386.exe
    expire_in: 1 week

test-windows:
  extends: .windows_build_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - go test -v -count=1 -race ./...
  allow_failure: false

sign-windows-amd64:
  extends: .windows_build_base
  stage: sign
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - build-windows-amd64
  script:
    - signtool sign /tr http://timestamp.digicert.com /td sha256 /fd sha256 /a cloudflared-windows-amd64.exe
  artifacts:
    paths:
      - cloudflared-windows-amd64.exe
    expire_in: 1 week

package-windows-msi:
  extends: .windows_build_base
  stage: package
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - sign-windows-amd64
  variables:
    MSI_VERSION: "${VERSION:-0.0.0}"
  script:
    - |
      # Build the MSI installer using WiX toolset
      $wixPath = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
      $env:PATH = "$wixPath;$env:PATH"
      candle.exe -dVersion=$MSI_VERSION -dBinPath=cloudflared-windows-amd64.exe installer\windows\cloudflared.wxs -out cloudflared.wixobj
      light.exe -ext WixUtilExtension cloudflared.wixobj -out cloudflared-windows-amd64.msi
    - signtool sign /tr http://timestamp.digicert.com /td sha256 /fd sha256 /a cloudflared-windows-amd64.msi
  artifacts:
    paths:
      - cloudflared-windows-amd64.msi
    expire_in: 1 week

upload-windows-artifacts:
  extends: .windows_build_base
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - package-windows-msi
    - sign-windows-amd64
  script:
    - |
      # Upload artifacts to release storage
      Write-Host "Uploading Windows artifacts for version $VERSION"
      aws s3 cp cloudflared-windows-amd64.exe s3://$RELEASE_BUCKET/cloudflared/$VERSION/cloudflared-windows-amd64.exe
      aws s3 cp cloudflared-windows-amd64.msi s3://$RELEASE_BUCKET/cloudflared/$VERSION/cloudflared-windows-amd64.msi
  artifacts:
    paths:
      - cloudflared-windows-amd64.exe
      - cloudflared-windows-amd64.msi
    expire_in: 4 weeks
